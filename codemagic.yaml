workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Build Release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-workflow:
    name: iOS Build (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Build iOS Simulator
        script: |
          flutter build ios --debug --simulator
      - name: Package for Appetize
        script: |
          echo "=== Listing build/ios ==="
          ls -la build/ios/ || echo "No build/ios directory"
          ls -la build/ios/iphonesimulator/ || echo "No iphonesimulator directory"
          ls -la build/ios/Debug-iphonesimulator/ || echo "No Debug-iphonesimulator directory"
          find build/ios -name "*.app" 2>/dev/null || echo "No .app found"
          zip -r Beepay.zip build/ios/iphonesimulator/Runner.app || \
          zip -r Beepay.zip build/ios/Debug-iphonesimulator/Runner.app || \
          echo "Zip failed"
    artifacts:
      - Beepay.zip
