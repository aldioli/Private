workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Build Release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-workflow:
    name: iOS Build (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Generate app icons
        script: dart run flutter_launcher_icons
      - name: Build iOS Simulator
        script: |
          flutter build ios --debug --simulator
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build/ios/simulator \
            build
      - name: Package for Appetize
        script: |
          APP_PATH=$(find build/ios/simulator -name "Runner.app" | head -1)
          echo "Found app at: $APP_PATH"
          zip -r Beepay.zip "$APP_PATH"
    artifacts:
      - Beepay.zip
