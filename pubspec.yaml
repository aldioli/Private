name: yemenpay
description: تطبيق المحفظة الرقمية اليمنية - YemenPay

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  provider: ^6.1.0

  # Supabase
  supabase_flutter: ^2.8.4

  # الاتصال بالإنترنت
  http: ^1.1.0

  # التخزين المحلي
  shared_preferences: ^2.2.2

  # QR Code (عرض فقط)
  qr_flutter: ^4.1.0

  # الأيقونات
  cupertino_icons: ^1.0.6

  # واجهة المستخدم
  animations: ^2.0.11
  shimmer: ^3.0.0

  # التاريخ والوقت
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
